<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authors and Publishers | Fictional World Library</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f8;color:#25243a;margin:0}
header{background:#211c35;color:white;padding:22px}
header a{color:#d2c4ff}
main{max-width:800px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
label{display:block;margin-top:16px;font-size:14px}
input,textarea{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}
button{background:#7547e8;color:white;border:0;padding:12px;margin-top:18px;border-radius:7px}
</style>
</head>
<body>
<header>
<a href="admin.html">Back to Dashboard</a>
<h1>Authors and Publishers</h1>
</header>
<main>
<section>
<h2>Add Author</h2>
<form>
<label>Author Name</label>
<input type="text" required>
<label>Author Email</label>
<input type="email">
<label>Author Biography</label>
<textarea rows="4"></textarea>
<button type="button">Save Author</button>
</form>
</section>
<section>
<h2>Add Publisher</h2>
<form>
<label>Publisher Name</label>
<input type="text" required>
<label>Contact Email</label>
<input type="email">
<label>Website</label>
<input type="url">
<button type="button">Save Publisher</button>
</form>
</section>
</main>
</body>
</html>
