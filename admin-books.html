<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Books | Fictional World Library</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f7;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    h1 { font-size: 25px; }
    h2 { font-size: 19px; }

    .panel {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000a;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button, .link-button {
      display: inline-block;
      padding: 11px 15px;
      border: 0;
      border-radius: 7px;
      background: #27213d;
      color: white;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary { background: #666; }
    .danger { background: #a32626; }

    .book {
      border: 1px solid #e2e2e2;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
    }

    .book p {
      overflow-wrap: anywhere;
      color: #555;
    }

    .message {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      overflow-wrap: anywhere;
    }

    .error { background: #ffe8e8; color: #8b1111; }
    .success { background: #e7f8eb; color: #176b2c; }
    .muted { color: #666; font-size: 14px; }

    #app { display: none; }
  </style>
</head>

<body>
  <div class="container">
    <div id="checking">Checking administrator access...</div>

    <main id="app">
      <header>
        <div>
          <h1>Manage Books</h1>
          <p class="muted">Fictional World Library administration</p>
        </div>

        <div>
          <a class="link-button" href="admin.html">Dashboard</a>
          <button id="logoutButton" class="secondary">Log out</button>
        </div>
      </header>

      <div id="message" aria-live="polite"></div>

      <section class="panel">
        <h2 id="formHeading">Add a Book</h2>

        <form id="bookForm">
          <input type="hidden" id="bookId">

          <label for="title">Book Title *</label>
          <input id="title" required maxlength="200">

          <label for="author">Author Name *</label>
          <input id="author" required maxlength="200">

          <label for="publisher">Publisher</label>
          <input id="publisher" maxlength="200">

          <label for="cover">Cover Image URL</label>
          <input id="cover" type="url" placeholder="https://...">

          <label for="genre">Genre *</label>
          <select id="genre" required>
            <option value="">Choose a genre</option>
            <option>Werewolf</option>
            <option>Mafia</option>
            <option>Erotica</option>
            <option>LGBTQ</option>
            <option>Billionaire Drama</option>
            <option>Vampire</option>
            <option>Paranormal</option>
            <option>Christian Romance</option>
          </select>

          <label for="length">Story Length *</label>
          <select id="length" required>
            <option value="">Choose length</option>
            <option>Short</option>
            <option>Long</option>
          </select>

          <label for="status">Publication Status *</label>
          <select id="status" required>
            <option value="">Choose status</option>
            <option>Draft</option>
            <option>Ongoing</option>
            <option>Completed</option>
          </select>

          <label for="synopsis">Synopsis *</label>
          <textarea id="synopsis" required></textarea>

          <label for="tags">Tags (separate with commas)</label>
          <input id="tags" placeholder="Alpha, romance, betrayal">

          <label>
            <input id="featured" type="checkbox" style="width:auto">
            Feature this book
          </label>

          <button id="saveButton" type="submit">Save Book</button>
          <button id="cancelButton" type="button" class="secondary">
            Clear Form
          </button>
        </form>
      </section>

      <section class="panel">
        <h2>Published and Saved Books</h2>
        <button id="refreshButton" class="secondary">Refresh Books</button>
        <div id="bookList">Loading books...</div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://mhvphjcreqhfnulflgiy.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_CPulXF1pmXf_7RacRrv1ag_MHuGAxXC";

      const ADMIN_ID =
        "a57c6170-7026-43b4-91af-ee7459776109";

      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false,
            storage: window.sessionStorage
          }
        }
      );

      const $ = id => document.getElementById(id);

      let currentBooks = [];
      let busy = false;

      function showMessage(text, type = "error") {
        $("message").replaceChildren();

        if (!text) return;

        const box = document.createElement("div");
        box.className = "message " + type;
        box.textContent = text;
        $("message").appendChild(box);
      }

      async function checkAdmin() {
        try {
          const { data, error } = await client.auth.getSession();

          if (error || !data.session) {
            window.location.replace("admin-login.html");
            return false;
          }

          if (data.session.user.id !== ADMIN_ID) {
            await client.auth.signOut();
            window.location.replace("admin-login.html");
            return false;
          }

          const { data: admin, error: adminError } = await client
            .from("admin_users")
            .select("user_id")
            .eq("user_id", ADMIN_ID)
            .maybeSingle();

          if (adminError || !admin) {
            await client.auth.signOut();
            window.location.replace("admin-login.html");
            return false;
          }

          $("checking").style.display = "none";
          $("app").style.display = "block";
          return true;

        } catch (error) {
          $("checking").textContent =
            "Unable to verify administrator access. Please return to the login page.";

          const link = document.createElement("a");
          link.href = "admin-login.html";
          link.textContent = " Return to admin login";
          $("checking").appendChild(link);
          return false;
        }
      }

      function resetForm() {
        $("bookForm").reset();
        $("bookId").value = "";
        $("formHeading").textContent = "Add a Book";
        $("saveButton").textContent = "Save Book";
        showMessage("");
      }

      function setBusy(value) {
        busy = value;
        $("saveButton").disabled = value;
        $("refreshButton").disabled = value;
      }

      async function loadBooks() {
        $("bookList").textContent = "Loading books...";

        const { data, error } = await client
          .from("books")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          $("bookList").textContent =
            "Could not load books: " + error.message;
          return;
        }

        currentBooks = data || [];
        renderBooks();
      }

      function renderBooks() {
        const list = $("bookList");
        list.replaceChildren();

        if (!currentBooks.length) {
          list.textContent = "No books found yet.";
          return;
        }

        currentBooks.forEach(book => {
          const card = document.createElement("article");
          card.className = "book";

          const title = document.createElement("h3");
          title.textContent = book.title || "Untitled book";
          card.appendChild(title);

          const details = document.createElement("p");
          details.textContent =
            "Author: " + (book.author_name || "Not specified") +
            " | Genre: " + (book.genre || "Not specified") +
            " | Length: " + (book.length || "Not specified") +
            " | Status: " + (book.status || "Not specified");
          card.appendChild(details);

          const edit = document.createElement("button");
          edit.textContent = "Edit";
          edit.addEventListener("click", () => editBook(book));
          card.appendChild(edit);

          const chapters = document.createElement("a");
          chapters.href = "admin-chapters.html";
          chapters.className = "link-button";
          chapters.textContent = "Manage Chapters";
          card.appendChild(chapters);

          const remove = document.createElement("button");
          remove.textContent = "Delete Book";
          remove.className = "danger";
          remove.addEventListener("click", () => deleteBook(book));
          card.appendChild(remove);

          list.appendChild(card);
        });
      }

      function editBook(book) {
        $("bookId").value = book.id;
        $("title").value = book.title || "";
        $("author").value = book.author_name || "";
        $("publisher").value = book.publisher || "";
        $("cover").value = book.cover_url || "";
        $("genre").value = book.genre || "";
        $("length").value = book.length || "";
        $("status").value = book.status || "";
        $("synopsis").value = book.synopsis || "";
        $("tags").value = book.tags || "";
        $("featured").checked = Boolean(book.featured);

        $("formHeading").textContent = "Edit Book";
        $("saveButton").textContent = "Update Book";

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      $("bookForm").addEventListener("submit", async event => {
        event.preventDefault();

        if (busy) return;

        setBusy(true);
        showMessage("");

        try {
          const book = {
            title: $("title").value.trim(),
            author_name: $("author").value.trim(),
            publisher: $("publisher").value.trim() || null,
            cover_url: $("cover").value.trim() || null,
            genre: $("genre").value,
            length: $("length").value,
            status: $("status").value,
            synopsis: $("synopsis").value.trim(),
            tags: $("tags").value.trim() || null,
            featured: $("featured").checked
          };

          const id = $("bookId").value;

          let result;

          if (id) {
            result = await client
              .from("books")
              .update(book)
              .eq("id", id)
              .select()
              .single();
          } else {
            result = await client
              .from("books")
              .insert(book)
              .select()
              .single();
          }

          if (result.error) {
            showMessage("Book could not be saved: " + result.error.message);
            return;
          }

          resetForm();
          showMessage(
            id ? "Book updated successfully." : "Book saved successfully.",
            "success"
          );

          await loadBooks();

        } catch (error) {
          showMessage("An unexpected error occurred: " + error.message);
        } finally {
          setBusy(false);
        }
      });

      async function deleteBook(book) {
        if (busy) return;

        const confirmed = window.confirm(
          'Delete "' + book.title +
          '"? This cannot be undone. Related chapters may need separate cleanup.'
        );

        if (!confirmed) return;

        setBusy(true);
        showMessage("");

        try {
          const { error } = await client
            .from("books")
            .delete()
            .eq("id", book.id);

          if (error) {
            showMessage("Book could not be deleted: " + error.message);
            return;
          }

          showMessage("Book deleted.", "success");
          await loadBooks();

        } finally {
          setBusy(false);
        }
      }

      $("cancelButton").addEventListener("click", resetForm);

      $("refreshButton").addEventListener("click", loadBooks);

      $("logoutButton").addEventListener("click", async () => {
        $("logoutButton").disabled = true;
        await client.auth.signOut();
        window.location.replace("admin-login.html");
      });

      checkAdmin().then(allowed => {
        if (allowed) loadBooks();
      });
    })();
  </script>
</body>
</html>
