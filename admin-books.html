<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Books | Fictional World Library</title>
  <style>
    :root {
      --bg:#100b1c;
      --surface:#1b122b;
      --surface-2:#26183a;
      --text:#f7f2ff;
      --muted:#b8accb;
      --accent:#a879ff;
      --accent-2:#7b4ce0;
      --border:#38264e;
      --danger:#ff7272;
      --success:#72d8a0;
      --radius:16px;
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      line-height:1.6;
    }

    a { color:var(--accent); text-decoration:none; }
    button,input,select,textarea {
      font:inherit;
    }

    .admin-shell {
      max-width:1100px;
      margin:0 auto;
      padding:24px 16px 80px;
    }

    .admin-header {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px 20px;
      margin-bottom:18px;
    }

    .admin-layout {
      display:grid;
      grid-template-columns:220px minmax(0,1fr);
      gap:18px;
    }

    .sidebar {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;
      align-self:start;
    }

    .sidebar a {
      display:block;
      padding:10px 12px;
      border-radius:10px;
      margin-bottom:6px;
      color:var(--text);
      text-decoration:none;
    }

    .sidebar a:hover {
      background:var(--surface-2);
    }

    .content {
      display:grid;
      gap:18px;
    }

    .panel {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px;
    }

    .panel h2 {
      margin:0 0 14px;
      font-size:22px;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }

    .form-group {
      display:grid;
      gap:6px;
      margin-bottom:14px;
    }

    .form-group label {
      color:var(--muted);
      font-weight:600;
    }

    input, select, textarea {
      width:100%;
      min-height:44px;
      background:var(--bg);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 12px;
    }

    textarea {
      min-height:120px;
      resize:vertical;
    }

    .btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:10px 16px;
      border-radius:10px;
      border:1px solid var(--accent-2);
      background:var(--accent-2);
      color:#fff;
      cursor:pointer;
      font-weight:600;
    }

    .btn.secondary {
      background:transparent;
      color:var(--text);
      border-color:var(--border);
    }

    .table-wrap {
      width:100%;
      overflow-x:auto;
    }

    table {
      width:100%;
      border-collapse:collapse;
      min-width:600px;
    }

    th, td {
      padding:12px 10px;
      border-bottom:1px solid var(--border);
      text-align:left;
    }

    .muted {
      color:var(--muted);
    }

    @media (max-width:760px) {
      .admin-layout {
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="admin-header">
      <h1>Admin Books</h1>
      <p class="muted">Manage books and chapters for the Fictional World Library.</p>
    </div>

    <div class="admin-layout">
      <aside class="sidebar">
        <a href="admin.html">Dashboard</a>
        <a href="admin-books.html">Books</a>
        <a href="admin-readers.html">Readers</a>
        <a href="admin-reviews.html">Reviews</a>
        <a href="admin-publishers.html">Publishers</a>
      </aside>

      <main class="content">
        <div class="panel">
          <h2>Add New Book</h2>
          <form id="bookForm">
            <div class="grid">
              <div class="form-group">
                <label for="title">Title</label>
                <input id="title" required />
              </div>

              <div class="form-group">
                <label for="genre">Genre</label>
                <select id="genre">
                  <option value="Werewolf">Werewolf</option>
                  <option value="Mafia">Mafia</option>
                  <option value="Erotica">Erotica</option>
                  <option value="LGBTQ">LGBTQ</option>
                  <option value="Billionaire Drama">Billionaire Drama</option>
                  <option value="Vampire">Vampire</option>
                  <option value="Paranormal">Paranormal</option>
                  <option value="Christian Romance">Christian Romance</option>
                </select>
              </div>

              <div class="form-group">
                <label for="title">Author Name</label>
                <input id="author_name" />
              </div>

              <div class="form-group">
                <label for="status">Status</label>
                <select id="status">
                  <option value="published">Published</option>
                  <option value="draft">Draft</option>
                  <option value="ongoing">Ongoing</option>
                  <option value="completed">Completed</option>
                </select>
              </div>

              <div class="form-group" style="grid-column:1/-1;">
                <label for="cover_url">Cover Image URL</label>
                <input id="cover_url" placeholder="https://example.com/cover.jpg" />
              </div>

              <div class="form-group" style="grid-column:1/-1;">
                <label for="synopsis">Synopsis / Description</label>
                <textarea id="synopsis"></textarea>
              </div>
            </div>

            <button class="btn" type="submit">Save Book</button>
          </form>
        </div>

        <div class="panel">
          <h2>Published Books</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Genre</th>
                  <th>Status</th>
                  <th>Author</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="bookTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://mhvphjcreqhfnulflgiy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_CPulXF1pmXf_7RacRrv1ag_MHuGAxXC";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const bookTableBody = document.getElementById("bookTableBody");

    async function loadBooks() {
      try {
        const { data, error } = await supabase
          .from("books")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        const rows = (data || []).map(book => `
          <tr>
            <td>${book.title || "Untitled"}</td>
            <td>${book.genre || "General"}</td>
            <td>${book.status || "Published"}</td>
            <td>${book.author_name || "Unknown"}</td>
            <td>
              <button class="btn secondary" type="button" data-book-id="${book.id}">Preview</button>
            </td>
          </tr>
        `).join("");

        bookTableBody.innerHTML = rows || `
          <tr>
            <td colspan="5" class="muted">No books yet.</td>
          </tr>
        `;
      } catch (error) {
        console.error("Load books error:", error);
        bookTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="muted">No books available right now.</td>
          </tr>
        `;
      }
    }

    document.getElementById("bookForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const title = document.getElementById("title").value.trim();
      const genre = document.getElementById("genre").value;
      const author_name = document.getElementById("author_name").value.trim();
      const status = document.getElementById("status").value;
      const cover_url = document.getElementById("cover_url").value.trim();
      const synopsis = document.getElementById("synopsis").value.trim();

      if (!title) {
        alert("Please enter a title.");
        return;
      }

      try {
        const { data, error } = await supabase
          .from("books")
          .insert([
            {
              title,
              genre,
              author_name,
              status,
              cover_url,
              synopsis,
              created_at: new Date().toISOString()
            }
          ])
          .select();

        if (error) throw error;

        document.getElementById("bookForm").reset();
        await loadBooks();
        alert("Book saved successfully.");
      } catch (error) {
        console.error("Book save error:", error);
        alert("Book save failed. " + (error?.message || "Unknown error"));
      }
    });

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-book-id]");
      if (!target) return;

      const bookId = target.getAttribute("data-book-id");
      alert("Selected book ID: " + bookId);
    });

    loadBooks();
  </script>
</body>
  </html>
