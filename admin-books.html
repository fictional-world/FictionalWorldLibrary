<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Management | Fictional World Library</title>

<style>
:root {
  --primary: #6b42c1;
  --dark: #211b38;
  --background: #f5f5f8;
  --border: #e5e2ed;
  --text: #29243b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--background);
  color: var(--text);
}

header {
  background: var(--dark);
  color: white;
  padding: 22px;
}

header a {
  color: #e4dcff;
  text-decoration: none;
}

header h1 {
  font-size: 25px;
  margin: 16px 0 6px;
}

main {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

h2 { font-size: 20px; margin-top: 0; }

label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #d8d3e2;
  border-radius: 7px;
  background: white;
  color: var(--text);
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  background: var(--primary);
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 12px 16px;
  margin: 12px 8px 0 0;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.secondary {
  background: #eeeaf5;
  color: var(--text);
}

.notice {
  background: #f1ecff;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 16px;
  line-height: 1.5;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

#message {
  display: none;
  padding: 13px;
  border-radius: 8px;
  margin-bottom: 16px;
  overflow-wrap: anywhere;
}

#message.success {
  display: block;
  background: #e8f7ee;
  color: #18794e;
}

#message.error {
  display: block;
  background: #fff0ef;
  color: #b42318;
}

.book-item, .chapter-item {
  border-top: 1px solid var(--border);
  padding: 15px 0;
}

.book-item h3 { margin-bottom: 8px; }

.muted {
  color: #77718a;
  font-size: 14px;
  line-height: 1.6;
}

@media(max-width:600px) {
  main { padding: 12px; }
  .grid { grid-template-columns: 1fr; }
  .card { padding: 16px; }
}
</style>
</head>

<body>

<header>
  <a href="admin.html">← Back to Admin Dashboard</a>
  <h1>Book Management</h1>
  <div>Fictional World Library</div>
</header>

<main>
  <div id="message" role="status" aria-live="polite"></div>

  <section class="card">
    <h2 id="formHeading">Add a Book</h2>

    <div class="notice">
      Add or update books here. Changes will be saved to Supabase when your account has the required database permissions.
    </div>

    <form id="bookForm">
      <input type="hidden" id="bookId">

      <label for="title">Book Title *</label>
      <input id="title" required maxlength="250" placeholder="Enter book title">

      <div class="grid">
        <div>
          <label for="author">Author Name *</label>
          <input id="author" required placeholder="Author name">
        </div>
        <div>
          <label for="publisher">Publisher</label>
          <input id="publisher" placeholder="Publisher name">
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="genre">Genre *</label>
          <select id="genre" required>
            <option value="">Select genre</option>
            <option>Werewolf</option>
            <option>Mafia</option>
            <option>Erotica</option>
            <option>LGBTQ</option>
            <option>Billionaire Drama</option>
            <option>Vampire</option>
            <option>Paranormal</option>
            <option>Christian Romance</option>
          </select>
        </div>
        <div>
          <label for="length">Story Length *</label>
          <select id="length" required>
            <option value="">Select length</option>
            <option>Short</option>
            <option>Long</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="status">Publication Status *</label>
          <select id="status" required>
            <option value="">Select status</option>
            <option>Draft</option>
            <option>Ongoing</option>
            <option>Completed</option>
          </select>
        </div>
        <div>
          <label for="featured">Featured Book?</label>
          <select id="featured">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>
      </div>

      <label for="cover">Cover Image URL</label>
      <input id="cover" type="url" placeholder="https://example.com/cover.jpg">

      <label for="tags">Tags</label>
      <input id="tags" placeholder="Romance, Alpha, Rejected Mate">

      <label for="synopsis">Synopsis *</label>
      <textarea id="synopsis" required placeholder="Write the book description"></textarea>

      <button id="saveBook" type="submit">Save Book</button>
      <button id="cancelEdit" type="button" class="secondary" hidden>Cancel Edit</button>
      <button type="reset" class="secondary">Clear Form</button>
    </form>
  </section>

  <section class="card">
    <h2>Chapter Management</h2>

    <form id="chapterForm">
      <label for="chapterBook">Select Book *</label>
      <select id="chapterBook" required>
        <option value="">Load books first</option>
      </select>

      <div class="grid">
        <div>
          <label for="chapterNumber">Chapter Number *</label>
          <input id="chapterNumber" type="number" min="1" step="1" required>
        </div>
        <div>
          <label for="chapterTitle">Chapter Title *</label>
          <input id="chapterTitle" required placeholder="Chapter title">
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="chapterStatus">Chapter Status</label>
          <select id="chapterStatus">
            <option value="Draft">Draft</option>
            <option value="Published">Published</option>
          </select>
        </div>
        <div>
          <label for="locked">Locked Chapter?</label>
          <select id="locked">
            <option value="true">Yes — paid chapter</option>
            <option value="false">No — free chapter</option>
          </select>
        </div>
      </div>

      <label for="chapterContent">Chapter Content *</label>
      <textarea id="chapterContent" required placeholder="Write or paste chapter content"></textarea>

      <button id="saveChapter" type="submit">Save Chapter</button>
    </form>

    <div id="chapterList"></div>
  </section>

  <section class="card">
    <h2>Existing Books</h2>
    <button id="refreshBooks" type="button" class="secondary">Refresh Book List</button>
    <div id="bookList" style="margin-top:16px">Loading books...</div>
  </section>
</main>

<!-- Load Supabase library before initializing the client. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);

  const SUPABASE_URL = "https://mhvphjcreqhfnulflgiy.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CPulXF1pmXf_7RacRrv1ag_MHuGAxXC";

  let client = null;
  let books = [];

  function message(text, type) {
    const box = $("message");
    box.textContent = text;
    box.className = type;
    box.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function clearMessage() {
    $("message").textContent = "";
    $("message").className = "";
    $("message").style.display = "none";
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  }

  function setupClient() {
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error(
        "The Supabase library did not load. Check your internet connection and refresh the page."
      );
    }

    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
  }

  async function loadBooks() {
    const { data, error } = await client
      .from("books")
      .select("id,title,author_name,publisher,genre,length,status,cover_url,tags,synopsis,featured,created_at")
      .order("created_at", { ascending: false });

    if (error) throw error;

    books = data || [];

    const select = $("chapterBook");
    select.replaceChildren(new Option("Select a book", ""));

    books.forEach(book => {
      select.add(new Option(book.title, String(book.id)));
    });

    renderBooks();
  }

  function renderBooks() {
    const list = $("bookList");
    list.replaceChildren();

    if (!books.length) {
      list.textContent = "No books found yet.";
      return;
    }

    books.forEach(book => {
      const item = document.createElement("div");
      item.className = "book-item";

      const heading = document.createElement("h3");
      heading.textContent = book.title;
      item.appendChild(heading);

      const details = document.createElement("p");
      details.className = "muted";
      details.textContent =
        "Author: " + (book.author_name || "Not specified") +
        " | Genre: " + (book.genre || "Not specified") +
        " | Length: " + (book.length || "Not specified") +
        " | Status: " + (book.status || "Not specified") +
        " | Featured: " + (book.featured ? "Yes" : "No");
      item.appendChild(details);

      const edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "Edit Book";
      edit.addEventListener("click", () => editBook(book));
      item.appendChild(edit);

      const view = document.createElement("button");
      view.type = "button";
      view.className = "secondary";
      view.textContent = "View Chapters";
      view.addEventListener("click", async () => {
        $("chapterBook").value = String(book.id);
        try {
          await loadChapters(book.id);
          $("chapterForm").scrollIntoView({ behavior: "smooth" });
        } catch (error) {
          message("Could not load chapters: " + error.message, "error");
        }
      });
      item.appendChild(view);

      list.appendChild(item);
    });
  }

  function editBook(book) {
    $("bookId").value = book.id;
    $("title").value = book.title || "";
    $("author").value = book.author_name || "";
    $("publisher").value = book.publisher || "";
    $("genre").value = book.genre || "";
    $("length").value = book.length || "";
    $("status").value = book.status || "";
    $("featured").value = String(Boolean(book.featured));
    $("cover").value = book.cover_url || "";
    $("tags").value = book.tags || "";
    $("synopsis").value = book.synopsis || "";

    $("formHeading").textContent = "Edit Book";
    $("saveBook").textContent = "Update Book";
    $("cancelEdit").hidden = false;
    $("bookForm").scrollIntoView({ behavior: "smooth" });
  }

  function resetBookForm() {
    $("bookForm").reset();
    $("bookId").value = "";
    $("formHeading").textContent = "Add a Book";
    $("saveBook").textContent = "Save Book";
    $("cancelEdit").hidden = true;
  }

  $("cancelEdit").addEventListener("click", resetBookForm);

  $("bookForm").addEventListener("submit", async event => {
    event.preventDefault();
    clearMessage();

    const button = $("saveBook");
    button.disabled = true;

    try {
      const id = $("bookId").value;

      const payload = {
        title: $("title").value.trim(),
        author_name: $("author").value.trim(),
        publisher: $("publisher").value.trim() || null,
        genre: $("genre").value,
        length: $("length").value,
        status: $("status").value,
        featured: $("featured").value === "true",
        cover_url: $("cover").value.trim() || null,
        tags: $("tags").value.trim() || null,
        synopsis: $("synopsis").value.trim()
      };

      let result;

      if (id) {
        result = await client.from("books")
          .update(payload)
          .eq("id", id)
          .select()
          .single();
      } else {
        result = await client.from("books")
          .insert(payload)
          .select()
          .single();
      }

      if (result.error) throw result.error;

      resetBookForm();
      await loadBooks();
      message(id ? "Book updated successfully." : "Book saved successfully.", "success");
    } catch (error) {
      console.error(error);
      message("Book save failed: " + error.message, "error");
    } finally {
      button.disabled = false;
    }
  });

  async function loadChapters(bookId) {
    const list = $("chapterList");
    list.textContent = "Loading chapters...";

    const { data, error } = await client
      .from("chapters")
      .select("id,book_id,chapter_number,title,locked,pub_status")
      .eq("book_id", String(bookId))
      .order("chapter_number", { ascending: true });

    if (error) throw error;

    list.replaceChildren();

    if (!data || data.length === 0) {
      list.textContent = "No chapters have been added to this book.";
      return;
    }

    data.forEach(chapter => {
      const item = document.createElement("div");
      item.className = "chapter-item";

      const title = document.createElement("strong");
      title.textContent =
        "Chapter " + chapter.chapter_number + ": " + chapter.title;
      item.appendChild(title);

      const info = document.createElement("p");
      info.className = "muted";
      info.textContent =
        "Status: " + (chapter.pub_status || "Not specified") +
        " | " + (chapter.locked ? "Locked" : "Free");
      item.appendChild(info);

      list.appendChild(item);
    });
  }

  $("chapterBook").addEventListener("change", async () => {
    clearMessage();

    if (!$("chapterBook").value) {
      $("chapterList").replaceChildren();
      return;
    }

    try {
      await loadChapters($("chapterBook").value);
    } catch (error) {
      message("Could not load chapters: " + error.message, "error");
    }
  });

  $("chapterForm").addEventListener("submit", async event => {
    event.preventDefault();
    clearMessage();

    const button = $("saveChapter");
    button.disabled = true;

    try {
      const bookId = $("chapterBook").value;
      const number = Number($("chapterNumber").value);
      const title = $("chapterTitle").value.trim();
      const content = $("chapterContent").value.trim();

      if (!bookId || !Number.isInteger(number) || number < 1 || !title || !content) {
        throw new Error("Complete all required chapter fields.");
      }

      const payload = {
        book_id: String(bookId),
        chapter_number: number,
        title: title,
        content: content,
        locked: $("locked").value === "true",
        pub_status: $("chapterStatus").value
      };

      const { error } = await client.from("chapters").insert(payload);
      if (error) throw error;

      $("chapterNumber").value = "";
      $("chapterTitle").value = "";
      $("chapterContent").value = "";

      await loadChapters(bookId);
      message("Chapter saved successfully.", "success");
    } catch (error) {
      console.error(error);
      message("Chapter save failed: " + error.message, "error");
    } finally {
      button.disabled = false;
    }
  });

  $("refreshBooks").addEventListener("click", async () => {
    clearMessage();

    try {
      await loadBooks();
      message("Book list refreshed.", "success");
    } catch (error) {
      message("Could not load books: " + error.message, "error");
    }
  });

  async function start() {
    try {
      setupClient();
      await loadBooks();
    } catch (error) {
      console.error(error);
      $("bookList").textContent = "Books could not be loaded.";
      $("chapterBook").replaceChildren(new Option("Books unavailable", ""));
      message("Connection failed: " + error.message, "error");
    }
  }

  start();
})();
</script>

</body>
</html>
