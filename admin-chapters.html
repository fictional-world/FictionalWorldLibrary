<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter Management | Fictional World Library</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f8;color:#25243a;margin:0}
header{background:#211c35;color:white;padding:22px}
header a{color:#d2c4ff}
main{max-width:800px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
label{display:block;margin-top:16px}
input,select,textarea{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}
button{background:#7547e8;color:white;border:0;padding:12px;margin-top:18px;border-radius:7px}
.note{color:#777;font-size:14px}
</style>
</head>
<body>
<header>
<a href="admin.html">Back to Dashboard</a>
<h1>Chapter Management</h1>
<p>Prepare and manage book chapters.</p>
</header>
<main>
<section>
<h2>Add Chapter</h2>
<form id="chapterForm">
<label>Book ID</label>
<input id="bookId" required placeholder="Enter the book ID">
<label>Chapter Number</label>
<input id="chapterNumber" type="number" min="1" required>
<label>Chapter Title</label>
<input id="chapterTitle" required>
<label>Chapter Content</label>
<textarea id="chapterContent" rows="12" required></textarea>
<label>Chapter Access</label>
<select id="access">
<option value="paid">Paid — 10 coins</option>
<option value="free">Free</option>
</select>
<button type="submit">Save Chapter</button>
</form>
<p class="note">Chapters are not saved yet. Database connection is pending.</p>
</section>
<section>
<h2>Existing Chapters</h2>
<p>Chapter records will appear here after database connection.</p>
</section>
</main>
<script>
document.getElementById("chapterForm").addEventListener("submit",function(e){
e.preventDefault();
alert("Chapter details entered. Saving will be enabled after database connection.");
});
</script>
</body>
</html>
