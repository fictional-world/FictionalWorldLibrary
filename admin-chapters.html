<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Chapters | Fictional World Library</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #f5f5f7; color: #222; font-family: Arial, sans-serif; }
    main { max-width: 900px; margin: auto; }
    .panel { background: white; padding: 20px; border-radius: 12px; margin: 18px 0; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 7px; font-size: 16px; }
    textarea { min-height: 200px; resize: vertical; }
    button, .link { display: inline-block; padding: 11px 14px; margin-top: 12px; border: 0; border-radius: 7px; background: #27213d; color: white; cursor: pointer; text-decoration: none; font-size: 15px; }
    button:disabled { opacity: .6; }
    .secondary { background: #666; }
    .danger { background: #a32626; }
    .chapter { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-top: 12px; overflow-wrap: anywhere; }
    .message { padding: 12px; margin: 12px 0; border-radius: 7px; overflow-wrap: anywhere; }
    .error { background: #ffe8e8; color: #8b1111; }
    .success { background: #e7f8eb; color: #176b2c; }
    .muted { color: #666; font-size: 14px; }
    #app { display: none; }
  </style>
</head>
<body>
<main>
  <div id="checking">Checking administrator access...</div>

  <div id="app">
    <header>
      <div>
        <h1>Manage Chapters</h1>
        <p class="muted">Fictional World Library</p>
      </div>
      <div>
        <a class="link" href="admin-books.html">Books</a>
        <a class="link" href="admin.html">Dashboard</a>
        <button id="logout" class="secondary">Log out</button>
      </div>
    </header>

    <div id="message" aria-live="polite"></div>

    <section class="panel">
      <h2>Add or Edit a Chapter</h2>
      <form id="chapterForm">
        <input type="hidden" id="chapterId">

        <label for="book">Book *</label>
        <select id="book" required>
          <option value="">Select a book</option>
        </select>

        <label for="number">Chapter Number *</label>
        <input id="number" type="number" min="1" step="1" required>

        <label for="title">Chapter Title *</label>
        <input id="title" maxlength="200" required>

        <label for="content">Chapter Content *</label>
        <textarea id="content" required placeholder="Write or paste the full chapter here..."></textarea>

        <label for="locked">Access *</label>
        <select id="locked" required>
          <option value="false">Free</option>
          <option value="true">Locked (coins required)</option>
        </select>

        <label for="status">Publication Status *</label>
        <select id="status" required>
          <option value="Draft">Draft</option>
          <option value="Published">Published</option>
        </select>

        <button id="save" type="submit">Save Chapter</button>
        <button id="clear" type="button" class="secondary">Clear Form</button>
      </form>
    </section>

    <section class="panel">
      <h2>Existing Chapters</h2>
      <label for="filterBook">Choose a book to view its chapters</label>
      <select id="filterBook">
        <option value="">All books</option>
      </select>
      <button id="refresh" class="secondary">Refresh Chapters</button>
      <div id="chapterList">Loading chapters...</div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function () {
  "use strict";

  const URL = "https://mhvphjcreqhfnulflgiy.supabase.co";
  const KEY = "sb_publishable_CPulXF1pmXf_7RacRrv1ag_MHuGAxXC";
  const ADMIN_ID = "a57c6170-7026-43b4-91af-ee7459776109";

  const db = window.supabase.createClient(URL, KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: false,
      storage: window.sessionStorage
    }
  });

  const $ = id => document.getElementById(id);
  let books = [];
  let chapters = [];
  let busy = false;

  function message(text, type = "error") {
    $("message").replaceChildren();
    if (!text) return;
    const el = document.createElement("div");
    el.className = "message " + type;
    el.textContent = text;
    $("message").appendChild(el);
  }

  async function guard() {
    try {
      const { data, error } = await db.auth.getSession();
      if (error || !data.session || data.session.user.id !== ADMIN_ID) {
        await db.auth.signOut();
        location.replace("admin-login.html");
        return false;
      }

      const { data: admin, error: adminError } = await db
        .from("admin_users")
        .select("user_id")
        .eq("user_id", ADMIN_ID)
        .maybeSingle();

      if (adminError || !admin) {
        await db.auth.signOut();
        location.replace("admin-login.html");
        return false;
      }

      $("checking").style.display = "none";
      $("app").style.display = "block";
      return true;
    } catch {
      $("checking").textContent = "Unable to verify access. Please log in again.";
      const link = document.createElement("a");
      link.href = "admin-login.html";
      link.textContent = "Return to login";
      $("checking").appendChild(link);
      return false;
    }
  }

  function setBusy(value) {
    busy = value;
    $("save").disabled = value;
    $("refresh").disabled = value;
  }

  function clearForm() {
    $("chapterForm").reset();
    $("chapterId").value = "";
    $("save").textContent = "Save Chapter";
    message("");
  }

  async function loadBooks() {
    const { data, error } = await db
      .from("books")
      .select("id,title")
      .order("title");

    if (error) {
      message("Could not load books: " + error.message);
      return;
    }

    books = data || [];

    for (const id of ["book", "filterBook"]) {
      const select = $(id);
      const previous = select.value;
      select.replaceChildren();

      const first = document.createElement("option");
      first.value = "";
      first.textContent = id === "book" ? "Select a book" : "All books";
      select.appendChild(first);

      books.forEach(b => {
        const option = document.createElement("option");
        option.value = String(b.id);
        option.textContent = b.title;
        select.appendChild(option);
      });

      if ([...select.options].some(o => o.value === previous)) {
        select.value = previous;
      }
    }
  }

  async function loadChapters() {
    $("chapterList").textContent = "Loading chapters...";

    let query = db.from("chapters").select("*").order("chapter_number");

    if ($("filterBook").value) {
      query = query.eq("book_id", $("filterBook").value);
    }

    const { data, error } = await query;

    if (error) {
      $("chapterList").textContent = "Could not load chapters: " + error.message;
      return;
    }

    chapters = data || [];
    renderChapters();
  }

  function renderChapters() {
    const list = $("chapterList");
    list.replaceChildren();

    if (!chapters.length) {
      list.textContent = "No chapters found for this selection.";
      return;
    }

    chapters.forEach(ch => {
      const card = document.createElement("article");
      card.className = "chapter";

      const heading = document.createElement("h3");
      heading.textContent = "Chapter " + ch.chapter_number + ": " + (ch.title || "");
      card.appendChild(heading);

      const book = books.find(b => String(b.id) === String(ch.book_id));
      const info = document.createElement("p");
      info.textContent =
        "Book: " + (book ? book.title : ch.book_id) +
        " | Access: " + (ch.locked ? "Locked" : "Free") +
        " | Status: " + (ch.pub_status || "Draft");
      card.appendChild(info);

      const edit = document.createElement("button");
      edit.textContent = "Edit";
      edit.addEventListener("click", () => {
        $("chapterId").value = ch.id;
        $("book").value = String(ch.book_id);
        $("number").value = ch.chapter_number;
        $("title").value = ch.title || "";
        $("content").value = ch.content || "";
        $("locked").value = String(Boolean(ch.locked));
        $("status").value = ch.pub_status || "Draft";
        $("save").textContent = "Update Chapter";
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      card.appendChild(edit);

      const del = document.createElement("button");
      del.textContent = "Delete";
      del.className = "danger";
      del.addEventListener("click", async () => {
        if (!confirm("Delete this chapter? This cannot be undone.")) return;
        const { error } = await db.from("chapters").delete().eq("id", ch.id);
        if (error) {
          message("Could not delete chapter: " + error.message);
        } else {
          message("Chapter deleted.", "success");
          await loadChapters();
        }
      });
      card.appendChild(del);
      list.appendChild(card);
    });
  }

  $("chapterForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;

    const bookId = $("book").value;
    if (!bookId) {
      message("Please select a book.");
      return;
    }

    const chapterNumber = Number($("number").value);
    if (!Number.isInteger(chapterNumber) || chapterNumber < 1) {
      message("Enter a valid chapter number.");
      return;
    }

    setBusy(true);
    message("");

    try {
      const record = {
        book_id: bookId,
        chapter_number: chapterNumber,
        title: $("title").value.trim(),
        content: $("content").value.trim(),
        locked: $("locked").value === "true",
        pub_status: $("status").value
      };

      const id = $("chapterId").value;
      let result;

      if (id) {
        result = await db.from("chapters").update(record).eq("id", id);
      } else {
        result = await db.from("chapters").insert(record);
      }

      if (result.error) {
        message("Could not save chapter: " + result.error.message);
        return;
      }

      clearForm();
      message(id ? "Chapter updated successfully." : "Chapter saved successfully.", "success");
      await loadChapters();
    } catch (err) {
      message("Unexpected error: " + err.message);
    } finally {
      setBusy(false);
    }
  });

  $("clear").addEventListener("click", clearForm);
  $("refresh").addEventListener("click", loadChapters);
  $("filterBook").addEventListener("change", loadChapters);

  $("logout").addEventListener("click", async () => {
    await db.auth.signOut();
    location.replace("admin-login.html");
  });

  if (await guard()) {
    await loadBooks();
    await loadChapters();
  }
})();
</script>
</body>
          </html>
