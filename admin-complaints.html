<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Support | Fictional World Library</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f8;color:#25243a;margin:0}
header{background:#211c35;color:white;padding:22px}
header a{color:#d2c4ff}
main{max-width:750px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
label{display:block;margin-top:16px}
input,select,textarea{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}
button{background:#7547e8;color:white;border:0;padding:12px;margin-top:18px;border-radius:7px}
.note{color:#777;font-size:14px}
</style>
</head>
<body>
<header>
<a href="admin.html">Back to Dashboard</a>
<h1>Reader Support</h1>
<p>Review reader complaints and support requests.</p>
</header>
<main>
<section>
<h2>Find a Complaint</h2>
<label for="reader">Reader ID or Email</label>
<input id="reader" placeholder="Enter reader ID or email">
<label for="status">Status</label>
<select id="status">
<option>All</option>
<option>Pending</option>
<option>In Progress</option>
<option>Resolved</option>
</select>
<button type="button" onclick="alert('Complaint records will load after database connection.')">Search Complaints</button>
</section>
<section>
<h2>Complaint Records</h2>
<p>No complaints loaded.</p>
<p class="note">This page is not connected to the database yet.</p>
</section>
</main>
</body>
</html>
