<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publishers | Fictional World Library</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f8;color:#25243a;margin:0}
header{background:#211c35;color:white;padding:22px}
header a{color:#d2c4ff}
main{max-width:750px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
label{display:block;margin-top:16px}
input,textarea{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}
button{background:#7547e8;color:white;border:0;padding:12px;margin-top:18px;border-radius:7px}
.note{color:#777;font-size:14px}
</style>
</head>
<body>
<header>
<a href="admin.html">Back to Dashboard</a>
<h1>Publisher Management</h1>
<p>Manage publishing partners.</p>
</header>
<main>
<section>
<h2>Add Publisher</h2>
<form id="publisherForm">
<label>Publisher Name</label>
<input id="name" required>
<label>Contact Email</label>
<input id="email" type="email">
<label>Website</label>
<input id="website" type="url">
<label>Notes</label>
<textarea id="notes" rows="4"></textarea>
<button type="submit">Save Publisher</button>
</form>
<p class="note">Publisher records are not saved yet. Database connection is pending.</p>
</section>
<section>
<h2>Publisher Records</h2>
<p>Publisher records will appear here after database connection.</p>
</section>
</main>
<script>
document.getElementById("publisherForm").addEventListener("submit",function(e){
e.preventDefault();
alert("Publisher details entered. Saving will be enabled after database connection.");
});
</script>
</body>
</html>
