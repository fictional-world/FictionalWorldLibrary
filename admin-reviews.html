<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Reviews | Fictional World Library</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f8;color:#25243a;margin:0}
header{background:#211c35;color:white;padding:22px}
header a{color:#d2c4ff}
main{max-width:850px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
input,select{width:100%;padding:12px;margin:10px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}
button{background:#7547e8;color:white;border:0;padding:12px;border-radius:7px}
.note{color:#777;font-size:14px}
.review{background:#f5f2ff;padding:15px;border-radius:8px;margin-top:12px}
</style>
</head>
<body>
<header>
<a href="admin.html">Back to Dashboard</a>
<h1>Book Reviews</h1>
<p>View ratings and feedback submitted for individual books.</p>
</header>
<main>
<section>
<h2>Find Book Reviews</h2>
<input id="bookSearch" type="search" placeholder="Search by book title or ID">
<select id="rating">
<option value="">All ratings</option>
<option value="5">5 stars</option>
<option value="4">4 stars</option>
<option value="3">3 stars</option>
<option value="2">2 stars</option>
<option value="1">1 star</option>
</select>
<button type="button" onclick="alert('Reviews will load after database connection.')">Search Reviews</button>
</section>

<section>
<h2>Review Records</h2>
<div class="review">
<strong>Book:</strong> —<br>
<strong>Reader:</strong> —<br>
<strong>Rating:</strong> —<br>
<strong>Review:</strong> —<br>
<strong>Date:</strong> —
</div>
<p class="note">Actual reviews will appear after the database is connected.</p>
</section>
</main>
</body>
</html>
