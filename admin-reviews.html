<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Feedback | Fictional World Library</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f8;color:#25243a;margin:0}
header{background:#211c35;color:white;padding:22px}
header a{color:#d2c4ff}
main{max-width:750px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
label{display:block;margin-top:16px}
input,select{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}
button{background:#7547e8;color:white;border:0;padding:12px;margin-top:18px;border-radius:7px}
.note{color:#777;font-size:14px}
</style>
</head>
<body>
<header>
<a href="admin.html">Back to Dashboard</a>
<h1>Reader Feedback</h1>
<p>Review reader ratings and feedback.</p>
</header>
<main>
<section>
<h2>Find Feedback</h2>
<label for="book">Book Title</label>
<input id="book" placeholder="Enter book title">
<label for="status">Feedback Status</label>
<select id="status">
<option>All</option>
<option>Pending Review</option>
<option>Reviewed</option>
</select>
<button type="button" onclick="alert('Feedback records will appear after database connection.')">Search Feedback</button>
</section>
<section>
<h2>Feedback Records</h2>
<p>No feedback records loaded.</p>
<p class="note">Database connection is pending.</p>
</section>
</main>
</body>
</html>
