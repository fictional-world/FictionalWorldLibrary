<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter Unlocks | Fictional World Library</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f8;color:#25243a;margin:0}
header{background:#211c35;color:white;padding:22px}
header a{color:#d2c4ff}
main{max-width:800px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
label{display:block;margin-top:16px}
input,select{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}
button{background:#7547e8;color:white;border:0;padding:12px;margin-top:18px;border-radius:7px}
.note{color:#777;font-size:14px}
</style>
</head>
<body>
<header>
<a href="admin.html">Back to Dashboard</a>
<h1>Chapter Unlocks</h1>
<p>Review paid and free chapter access.</p>
</header>
<main>
<section>
<h2>Search Unlock Records</h2>
<label for="reader">Reader ID</label>
<input id="reader" placeholder="Enter reader ID">
<label for="chapter">Chapter ID</label>
<input id="chapter" placeholder="Enter chapter ID">
<label for="type">Access Type</label>
<select id="type">
<option>All</option>
<option>Paid</option>
<option>Free</option>
</select>
<button type="button" onclick="alert('Unlock records will load after database connection.')">Search Records</button>
</section>
<section>
<h2>Unlock History</h2>
<p>No records loaded.</p>
<p class="note">This page is not connected to the database yet.</p>
</section>
</main>
</body>
</html>
