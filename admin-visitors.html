<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Analytics | Fictional World Library</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f8;color:#25243a;margin:0}
header{background:#211c35;color:white;padding:22px}
header a{color:#d2c4ff}
main{max-width:800px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
input{width:100%;padding:12px;margin-top:8px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}
button{background:#7547e8;color:white;border:0;padding:12px;margin-top:15px;border-radius:7px}
.metric{padding:15px;background:#f0ebff;border-radius:8px;margin:12px 0}
.note{color:#777;font-size:14px}
</style>
</head>
<body>
<header>
<a href="admin.html">Back to Dashboard</a>
<h1>Visitor Analytics</h1>
<p>Review website traffic and visitor activity.</p>
</header>
<main>
<section>
<h2>Traffic Overview</h2>
<div class="metric">Total Visitors: <strong>—</strong></div>
<div class="metric">Visitors Today: <strong>—</strong></div>
<div class="metric">Visitors This Month: <strong>—</strong></div>
<div class="metric">Most Viewed Books: <strong>—</strong></div>
<p class="note">Visitor statistics will appear after the analytics database is connected.</p>
</section>
<section>
<h2>Find Visitor Records</h2>
<label for="date">Filter by date</label>
<input id="date" type="date">
<button type="button" onclick="alert('Visitor records will be available after database connection.')">Search Records</button>
</section>
</main>
</body>
</html>
